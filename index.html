<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitación para 9no grado – C.E.B.G. Abraham Riera Peña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9edf5;--bg2:#d5dcec;--ink:#14224a;--mute:#4f5b7e;--gold:#8a6a1f;--gold2:#b8902f;--card:#fbfcff;--line:rgba(138,106,31,.55);--shadow:rgba(20,34,74,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081230;--bg2:#13255a;--ink:#f1e8d0;--mute:#a7b2d0;--gold:#d8b765;--gold2:#f2d68e;--card:#0f1d45;--line:rgba(216,183,101,.55);--shadow:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#081230;--bg2:#13255a;--ink:#f1e8d0;--mute:#a7b2d0;--gold:#d8b765;--gold2:#f2d68e;--card:#0f1d45;--line:rgba(216,183,101,.55);--shadow:rgba(0,0,0,.55)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 15%,var(--bg2),var(--bg) 72%) fixed;color:var(--ink);font:300 16px/1.6 Jost,system-ui,sans-serif;overflow-x:hidden}
main{min-height:100dvh;display:grid;place-items:center;padding:28px 16px;position:relative;z-index:1}
.sp{position:fixed;bottom:-12px;border-radius:50%;background:var(--gold2);opacity:0;pointer-events:none;animation:drift linear infinite;z-index:0}
@keyframes drift{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.7}100%{transform:translateY(-105vh) translateX(30px) scale(1);opacity:0}}

/* Sobre */
#env{text-align:center;transition:opacity .6s,transform .6s}
#env.out{opacity:0;transform:translateY(40px) scale(.94)}
.env{position:relative;display:block;width:min(340px,82vw);aspect-ratio:3/2;margin:0 auto 22px;padding:0;border:1px solid var(--line);border-radius:6px;background:linear-gradient(160deg,var(--card),var(--bg2));cursor:pointer;perspective:900px;box-shadow:0 34px 60px -24px var(--shadow);animation:bob 4.5s ease-in-out infinite;color:inherit}
.env:focus-visible,.btn:focus-visible,.ghost:focus-visible{outline:2px solid var(--gold2);outline-offset:4px}
@keyframes bob{50%{transform:translateY(-8px)}}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.6%,var(--line) 50%,transparent 50.4%),linear-gradient(to top left,transparent 49.6%,var(--line) 50%,transparent 50.4%);clip-path:polygon(0 100%,50% 40%,100% 100%);opacity:.7}
.flap{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(var(--bg2),var(--card));clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s cubic-bezier(.5,0,.2,1);backface-visibility:visible;filter:drop-shadow(0 4px 6px var(--shadow))}
.seal{position:absolute;left:50%;top:56%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 28%,var(--gold2),var(--gold));color:#fff;font:600 24px "Cormorant Garamond",serif;box-shadow:0 6px 14px var(--shadow);transition:opacity .4s,transform .5s}
.env.open{animation:none}
.env.open .flap{transform:rotateX(180deg)}
.env.open .seal{opacity:0;transform:scale(.4)}
.hint{margin:0;color:var(--mute);letter-spacing:.04em;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* Invitación */
.card{position:relative;width:min(580px,100%);padding:clamp(34px,7vw,64px) clamp(22px,6vw,56px);text-align:center;background:var(--card);border:1px solid var(--line);box-shadow:0 40px 80px -30px var(--shadow);transition:transform .2s ease-out}
.card::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);pointer-events:none}
.card.show{animation:pop 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes pop{from{opacity:0;transform:translateY(60px) scale(.92)}}
.card.show .rv{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*.13s + .35s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
h1{margin:0;font:italic 500 clamp(54px,14vw,92px)/1 "Cormorant Garamond",Georgia,serif;background:linear-gradient(100deg,var(--gold),var(--gold2),var(--gold),var(--gold2));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-300% 0}}
.orn{display:flex;align-items:center;gap:12px;justify-content:center;margin:18px auto;max-width:260px;color:var(--gold)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}
.orn i{width:8px;height:8px;rotate:45deg;background:var(--gold)}
.for{margin:0;font:500 clamp(22px,5vw,28px)/1.2 "Cormorant Garamond",Georgia,serif}
.school{margin:6px 0 0;color:var(--mute);font-size:15px;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:34px 0 28px;border-block:1px solid var(--line)}
.it{padding:20px 8px;transition:background .3s}
.it+.it{border-left:1px solid var(--line)}
.it:hover{background:color-mix(in srgb,var(--gold2) 12%,transparent)}
.it small{display:block;color:var(--gold);font-size:13px;margin-bottom:6px}
.it b{display:block;font:600 clamp(18px,4.4vw,23px)/1.2 "Cormorant Garamond",Georgia,serif}
.cd{display:flex;justify-content:center;gap:clamp(10px,3vw,22px);margin:6px 0 30px}
.cd div{min-width:58px}
.cd span{display:block;font:500 clamp(30px,8vw,42px)/1 "Cormorant Garamond",Georgia,serif;font-variant-numeric:tabular-nums}
.cd span.tick{animation:flip .5s}
@keyframes flip{from{opacity:.2;transform:translateY(-6px)}}
.cd small{color:var(--mute);font-size:12px}
.done{font:italic 500 26px "Cormorant Garamond",serif;color:var(--gold);margin:6px 0 30px}
.btn{display:inline-block;padding:13px 30px;border:1px solid var(--gold);color:var(--ink);text-decoration:none;background:linear-gradient(var(--gold2),var(--gold)) 0 100%/100% 0 no-repeat;transition:background-size .35s,color .35s}
.btn:hover{background-size:100% 100%;color:#fff}
.ghost{display:block;margin:20px auto 0;background:none;border:0;color:var(--mute);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
@media (max-width:480px){.grid{grid-template-columns:1fr}.it+.it{border-left:0;border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
  <section id="env">
    <button class="env" id="open" type="button" aria-label="Abrir la invitación"><span class="flap"></span><span class="seal">9</span></button>
    <p class="hint">Toca el sobre para abrirlo</p>
  </section>

  <article class="card" id="inv" hidden>
    <h1 class="rv" style="--i:0">Te invitamos</h1>
    <div class="orn rv" style="--i:1"><i></i></div>
    <p class="for rv" style="--i:2">Alumnos de 9no grado</p>
    <p class="school rv" style="--i:3">C.E.B.G. Abraham Riera Peña</p>
    <div class="grid rv" style="--i:4">
      <div class="it"><small>Fecha</small><b>Viernes 27 de noviembre</b></div>
      <div class="it"><small>Hora</small><b>1:00 pm</b></div>
      <div class="it"><small>Lugar</small><b>Centro de Convenciones Omoa</b></div>
    </div>
    <div id="cd" class="cd rv" style="--i:5" aria-live="off"></div>
    <a class="btn rv" style="--i:6" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Centro+de+Convenciones+Omoa">Ver ubicación en el mapa</a>
    <button class="ghost rv" style="--i:7" id="again" type="button">Volver a cerrar el sobre</button>
  </article>
</main>
<script>
(function(){
var $=function(s){return document.querySelector(s)},env=$('#env'),btn=$('#open'),inv=$('#inv'),cd=$('#cd');
// Destellos dorados de fondo
for(var i=0;i<22;i++){var s=document.createElement('span'),z=3+Math.random()*5;s.className='sp';
s.style.cssText='left:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+(9+Math.random()*10)+'s;animation-delay:'+(-Math.random()*15)+'s';document.body.appendChild(s)}
// Abrir sobre
function abrir(){if(btn.classList.contains('open'))return;btn.classList.add('open');
setTimeout(function(){env.classList.add('out')},950);
setTimeout(function(){env.hidden=true;inv.hidden=false;inv.classList.remove('show');void inv.offsetWidth;inv.classList.add('show')},1600)}
btn.addEventListener('click',abrir);
$('#again').addEventListener('click',function(){inv.hidden=true;inv.classList.remove('show');btn.classList.remove('open');env.classList.remove('out');env.hidden=false});
// Inclinación suave con el mouse
inv.addEventListener('pointermove',function(e){if(e.pointerType!=='mouse')return;var r=inv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
inv.style.transform='perspective(1000px) rotateY('+x*7+'deg) rotateX('+(-y*7)+'deg)'});
inv.addEventListener('pointerleave',function(){inv.style.transform=''});
// Cuenta regresiva (hora de Honduras, UTC-6)
var T=new Date('2026-11-27T13:00:00-06:00'),prev=[];
function p(n){return n<10?'0'+n:''+n}
function tick(){var d=T-Date.now();
if(d<=0){cd.className='done rv';cd.textContent='¡Gracias por acompañarnos!';clearInterval(t);return}
var v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60],l=['días','horas','min','seg'];
if(!prev.length)cd.innerHTML=l.map(function(x){return '<div><span></span><small>'+x+'</small></div>'}).join('');
var sp=cd.querySelectorAll('span');
v.forEach(function(n,i){var t=p(n);if(prev[i]!==t){sp[i].textContent=t;sp[i].classList.remove('tick');void sp[i].offsetWidth;sp[i].classList.add('tick');prev[i]=t}})}
var t=setInterval(tick,1000);tick();
})();
</script>
</body>
</html>
